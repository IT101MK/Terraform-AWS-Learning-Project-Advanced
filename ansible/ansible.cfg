# ansible.cfg
#
# Project-local Ansible defaults. Ansible auto-loads this file when you run
# any `ansible`/`ansible-playbook` command from this directory (or a
# descendant), so no ANSIBLE_CONFIG env var or --config flag is needed as
# long as you `cd` into ansible/ first.
#
# EXCEPTION - WSL users on a /mnt/c/... clone: Ansible refuses to
# auto-load a config file from a world-writable (777) directory, which is
# how WSL exposes Windows-mounted paths by default, and fails silently
# (only a buried warning, no hard error). Set ANSIBLE_CONFIG explicitly
# instead: ANSIBLE_CONFIG=./ansible.cfg ansible-playbook ...

[defaults]
# Dynamic inventory only - there is no static hosts file, because the fleet
# is defined by Terraform (via tags) and can grow/shrink between runs.
inventory = inventory/aws_ec2.yml

# We never SSH into these hosts (see aws_ssm connection plugin in the
# inventory), so there is no SSH host key to check. Leaving the default
# (True) would make Ansible pointlessly probe for known_hosts entries that
# will never exist for an SSM-only fleet.
host_key_checking = False

# Retry files (*.retry) are a leftover from SSH-era Ansible and are not
# useful here - a failed SSM connection attempt isn't fixed by replaying
# the same host list, and the files just clutter the repo.
retry_files_enabled = False

# Roughly matches the default host_count (2-5); keeps runs against the
# small fleet snappy without the cost/complexity of tuning this further.
forks = 5

# Plain, readable console output - no third-party callback plugins to
# install just for a small portfolio fleet.
stdout_callback = default

[inventory]
# Enabling the plugin here is what actually makes `inventory/aws_ec2.yml`
# get parsed as a dynamic inventory source instead of an inert YAML file -
# the aws_ec2 plugin is not enabled by default. Listing only the one
# plugin we use (rather than relying on the out-of-the-box "try every
# inventory plugin Ansible ships with" behaviour) is also slightly faster
# at startup and makes the intent obvious to a reader.
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Irrelevant for aws_ssm connections, but harmless to leave sane in case
# anyone ever adds an SSH-connected host to this inventory later.
pipelining = True
